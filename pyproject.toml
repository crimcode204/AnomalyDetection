[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Anomaly detection labs"
readme = "README.md"
authors = [
    { name = "Valentin-Ioan Munteanu", email = "valentin@vimunteanu.me" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "pyod>=3.6.6",
    "scikit-learn>=1.9.1",
]

# [build-system]
# requires = ["uv_build>=0.12.23,<0.13.0"]
# build-backend = "uv_build"

# using hatchling for better structuring
# maybe change back to the new default later
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab1"]
